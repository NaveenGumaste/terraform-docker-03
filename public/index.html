<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f2" />
    <meta name="description" content="A simple todo list that saves in your browser." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <title>Daymark Todo</title>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Daymark Todo home">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <span>daymark</span>
        </a>
        <span class="local-label"><span></span> SAVED ON THIS DEVICE</span>
      </header>

      <main class="main-content">
        <section class="intro">
          <p class="eyebrow">A SIMPLE SPACE FOR YOUR TASKS</p>
          <h1>My Todo List</h1>
          <p class="subtitle">Keep it simple. Take it one task at a time.</p>
        </section>

        <section class="todo-card" aria-labelledby="todo-heading">
          <form class="task-form" id="task-form">
            <label class="sr-only" for="task-input">Task name</label>
            <input id="task-input" name="title" type="text" maxlength="120" placeholder="What needs to get done?" autocomplete="off" required />
            <button class="add-button" id="submit-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
            <button class="cancel-button" id="cancel-edit" type="button" hidden>Cancel</button>
          </form>

          <div class="list-heading">
            <h2 id="todo-heading">Tasks</h2>
            <span id="task-count">0 remaining</span>
          </div>

          <ul class="task-list" id="task-list" aria-live="polite"></ul>
          <div class="empty-state" id="empty-state">
            <span class="empty-check" aria-hidden="true">✓</span>
            <p>No tasks yet. Add one above to get started.</p>
          </div>

          <footer class="card-footer">Your list is stored in this browser.</footer>
        </section>
      </main>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
